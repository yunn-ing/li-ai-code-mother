spring:
  application:
    name: yu-ai-code-mother-backend











server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.liyurui.yuaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
